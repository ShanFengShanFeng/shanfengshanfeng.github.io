name: Update Google Scholar Stats

on:
  schedule:
    # 每天 UTC 08:00（北京时间 16:00）自动运行
    - cron: "0 8 * * *"
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ "main" ]  # 每次推送 main 分支时触发

jobs:
  update-google-scholar-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        working-directory: google_scholar_crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Google Scholar crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        working-directory: google_scholar_crawler
        run: python main.py

      - name: Push results to google-scholar-stats branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"

          # 切换到（或创建）google-scholar-stats 分支
          git fetch origin google-scholar-stats 2>/dev/null \
            && git checkout google-scholar-stats \
            || git checkout --orphan google-scholar-stats

          # 清除该分支上所有原有文件
          git rm -rf . --quiet 2>/dev/null || true

          # 将爬取结果复制到根目录
          cp google_scholar_crawler/results/gs_data.json .
          cp google_scholar_crawler/results/gs_data_shieldsio.json .

          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Auto update: Google Scholar stats $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin google-scholar-stats --force
