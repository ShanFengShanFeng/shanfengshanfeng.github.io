name: Update academic publications

on:
  schedule:
    # Daily at 16:00 China Standard Time (GitHub may delay scheduled runs).
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_google_scholar_stats.yml"
      - "google_scholar_crawler/**"
      - "cnki_crawler/**"

permissions:
  contents: write

concurrency:
  group: google-scholar-publications
  cancel-in-progress: false

jobs:
  google_scholar:
    name: Fetch Google Scholar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install Google Scholar dependencies
        working-directory: google_scholar_crawler
        run: python -m pip install -r requirements.txt

      - name: Run Google Scholar crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || 'lJydfDEAAAAJ' }}
        working-directory: google_scholar_crawler
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Upload successful Google Scholar data
        uses: actions/upload-artifact@v4
        with:
          name: google-scholar-data
          path: |
            google_scholar_crawler/results/gs_data.json
            google_scholar_crawler/results/gs_data_shieldsio.json
          if-no-files-found: error
          retention-days: 1

  cnki:
    name: Fetch CNKI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cnki_crawler/requirements.txt

      - name: Install CNKI dependencies
        working-directory: cnki_crawler
        run: python -m pip install -r requirements.txt

      - name: Run CNKI crawler
        env:
          CNKI_AUTHOR_ID: ${{ vars.CNKI_AUTHOR_ID || '000077413616' }}
        working-directory: cnki_crawler
        run: python main.py

      - name: Upload successful CNKI data
        uses: actions/upload-artifact@v4
        with:
          name: cnki-data
          path: cnki_crawler/results/cnki_data.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish successful datasets
    needs: [google_scholar, cnki]
    if: ${{ always() && (needs.google_scholar.result == 'success' || needs.cnki.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Google Scholar data
        if: needs.google_scholar.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: google-scholar-data
          path: refreshed-data

      - name: Download CNKI data
        if: needs.cnki.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cnki-data
          path: refreshed-data

      - name: Update data branch while preserving previous successful data
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/academic-publications-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Start from the existing data branch so a failed source keeps its last data.
          remote_ref="$(git ls-remote --heads origin refs/heads/google-scholar-stats)"
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags origin refs/heads/google-scholar-stats
            git worktree add --detach "$data_dir" FETCH_HEAD
          else
            # Create an empty branch only on the very first successful synchronization.
            git worktree add --detach "$data_dir" HEAD
            git -C "$data_dir" checkout --orphan academic-publications-initial
            git -C "$data_dir" rm -rf --ignore-unmatch .
          fi

          # Artifacts contain only datasets from successful source jobs.
          for name in gs_data.json gs_data_shieldsio.json cnki_data.json; do
            if [ -f "refreshed-data/$name" ]; then
              cp "refreshed-data/$name" "$data_dir/$name"
              git -C "$data_dir" add "$name"
            fi
          done

          if git -C "$data_dir" diff --cached --quiet; then
            echo "Publication datasets are unchanged."
            exit 0
          fi
          git -C "$data_dir" commit -m "Update academic publications"
          # A concurrent external change causes a visible failure instead of lost data.
          git -C "$data_dir" push origin HEAD:refs/heads/google-scholar-stats
