name: Update Google Scholar publications

on:
  schedule:
    # Daily at 16:00 China Standard Time.
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_google_scholar_stats.yml"
      - "google_scholar_crawler/**"

permissions:
  contents: write

concurrency:
  group: google-scholar-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        working-directory: google_scholar_crawler
        run: python -m pip install -r requirements.txt

      - name: Run Google Scholar crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || 'lJydfDEAAAAJ' }}
        working-directory: google_scholar_crawler
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Push results to google-scholar-stats branch
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/google-scholar-output"
          mkdir -p "$output_dir"
          cp google_scholar_crawler/results/*.json "$output_dir/"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan scholar-publications-output
          git rm -rf .
          cp "$output_dir"/*.json .
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Update Google Scholar publications"
          git push origin HEAD:google-scholar-stats --force
